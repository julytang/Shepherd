<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shepherd · iPhone Duo 内屏分屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th{--canvas:#f6f5f4;--surface:#ffffff;--ink:rgba(0,0,0,0.95);--ink2:#31302e;--muted:#615d59;--faint:#a39e98;--hair:#e6e6e6;--ov:rgba(0,0,0,0.05);--link:#0075de;--needInk:#793400;--needBg:rgba(221,91,0,0.08);--glass:rgba(255,255,255,0.58);--glassEdge:rgba(255,255,255,0.72);--glassHi:rgba(255,255,255,0.9);--frame:#d9d7d4;color-scheme:light}
.th.dk{--canvas:#191817;--surface:#252422;--ink:rgba(255,255,255,0.92);--ink2:#dcd8d3;--muted:#a39e98;--faint:#7d7873;--hair:#3a3836;--ov:rgba(255,255,255,0.08);--link:#62aef0;--needInk:#f2a464;--needBg:rgba(221,91,0,0.16);--glass:rgba(44,43,41,0.58);--glassEdge:rgba(255,255,255,0.12);--glassHi:rgba(255,255,255,0.12);--frame:#0d0d0c;color-scheme:dark}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #0075de;outline-offset:2px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;line-height:1.33;font-weight:600;letter-spacing:.125px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:inset 0 1px 0 var(--glassHi),rgba(0,0,0,0.04) 0px 4px 18px,rgba(0,0,0,0.027) 0px 2.025px 7.847px}
.glass-tint{background:rgba(0,117,222,0.92);color:#fff;border:1px solid rgba(255,255,255,0.3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),rgba(0,0,0,0.04) 0px 4px 18px}
.icb{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-s{height:44px;padding:0 16px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;white-space:nowrap;background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair),rgba(0,0,0,0.04) 0px 4px 18px}
.chip{height:26px;padding:0 10px;border-radius:9999px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.125px;background:var(--ov);color:var(--ink2);white-space:nowrap}
.need{width:18px;height:18px;border-radius:50%;background:#dd5b00;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div class="th {{themeClass}}" style="width:951px;height:669px;position:relative;overflow:hidden;background:var(--frame);font-family:Inter,-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;font-feature-settings:'lnum','locl';color:var(--ink);-webkit-font-smoothing:antialiased">

<section aria-label="Shepherd（分屏，compact 宽度）" style="position:absolute;left:0;top:0;bottom:0;width:536px;background:var(--canvas);border-radius:0 26px 26px 0;overflow:hidden">
<div style="position:absolute;inset:0;padding:112px 18px 92px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px">
<div style="align-self:flex-end;max-width:88%;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.5">把 OAuth 登录流程切到 PKCE，并补齐 callback 异常单测。</div>
<p style="margin:0;font-size:16px;line-height:1.5">PKCE 的改动写完了。接下来跑认证模块的竞态测试。</p>
<div style="background:var(--surface);border:1.5px solid #dd5b00;border-radius:20px;overflow:hidden">
<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--needBg)"><span class="need" aria-hidden="true">!</span><span class="eyebrow" style="color:var(--needInk);flex:1">等你处理 · Shell 命令</span></div>
<div style="padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px">
<div class="mono" style="font-size:13px;line-height:1.5;background:var(--canvas);border-radius:8px;padding:8px 10px;word-break:break-all">$ go test ./internal/auth/... -v -race</div>
<button class="glass-tint" style="height:48px;border-radius:9999px;font-size:16px;font-weight:500">允许一次</button>
<div style="display:flex;gap:10px"><button class="btn-s" style="flex:1">本会话允许</button><button class="btn-s" style="flex:1">拒绝…</button></div>
</div>
</div>
</div>
<div aria-hidden="true" style="position:absolute;top:0;left:0;right:0;height:130px;pointer-events:none;background:linear-gradient(var(--canvas) 45%,color-mix(in srgb,var(--canvas) 80%,transparent) 70%,transparent)"></div>
<header style="position:absolute;top:20px;left:14px;right:14px;height:48px;display:flex;align-items:center;gap:10px">
<button aria-label="返回等你处理" class="glass icb"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="stroke-width:2.2"><path d="m15 6-6 6 6 6"></path></svg></button>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center"><span style="font-size:16px;font-weight:600">feat/oauth-pkce</span><span class="eyebrow" style="color:var(--muted)">api-server · Claude Code</span></div>
<button aria-label="查看 3 个文件的变更" class="glass" style="height:44px;padding:0 14px;border-radius:9999px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"></rect><path d="M12 3.5v17M7.5 8.5v4M5.5 10.5h4M14.5 10.5h4"></path></svg>3</button>
</header>
<div style="position:absolute;top:74px;left:18px;right:18px;display:flex;gap:6px;overflow:hidden"><span class="chip">claude-direct</span><span class="chip">订阅登录</span><span class="chip">权限：询问</span></div>
<div style="position:absolute;left:12px;right:12px;bottom:16px;display:flex;align-items:flex-end;gap:8px">
<button aria-label="添加文件或图片" class="glass icb" style="width:48px;height:48px"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<div class="glass" style="flex:1;border-radius:24px;padding:4px 4px 4px 14px;display:flex;align-items:center">
<label for="duo-split-composer" class="sr">给 Agent 的下一条指令</label>
<textarea id="duo-split-composer" rows="1" placeholder="输入下一条指令…" style="flex:1;resize:none;border:0;background:transparent;font-size:16px;line-height:1.5;padding:8px 0;min-height:40px"></textarea>
<button aria-label="发送" class="glass-tint icb" style="width:40px;height:40px"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="stroke-width:2.2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
</section>

<div aria-hidden="true" style="position:absolute;left:536px;top:0;bottom:0;width:10px;display:flex;align-items:center;justify-content:center"><span style="width:4px;height:44px;border-radius:2px;background:var(--faint)"></span></div>

<section aria-label="另一个 App" style="position:absolute;left:546px;top:0;bottom:0;right:0;background:var(--surface);border-radius:26px 0 0 26px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px">
<svg class="ic" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color:var(--faint)"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M3 9h18"></path></svg>
<span style="font-size:16px;font-weight:600;color:var(--ink2)">另一个 App</span>
<span style="font-size:14px;line-height:1.43;color:var(--muted);text-align:center;max-width:300px">例如在浏览器里看 PR 页面或 CI 日志。系统竖条这次落在右侧这个 App 上，Shepherd 一栏没有水平安全区，工具栏回到顶部。分屏宽度和竖条归属都由系统决定，每栏各自读取。</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["浅色","深色"],"default":"浅色","section":"外观"},"$preview":{"width":951,"height":669}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.appearance ?? '浅色') === '深色' ? 'dk' : '' };
  }
}
</script>
</body>
</html>
