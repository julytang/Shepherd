<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shepherd · iPhone Duo 外屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th{--canvas:#f6f5f4;--surface:#ffffff;--ink:rgba(0,0,0,0.95);--ink2:#31302e;--muted:#615d59;--faint:#a39e98;--hair:#e6e6e6;--ov:rgba(0,0,0,0.05);--link:#0075de;--needInk:#793400;--glass:rgba(255,255,255,0.58);--glassEdge:rgba(255,255,255,0.72);--glassHi:rgba(255,255,255,0.9);color-scheme:light}
.th.dk{--canvas:#191817;--surface:#252422;--ink:rgba(255,255,255,0.92);--ink2:#dcd8d3;--muted:#a39e98;--faint:#7d7873;--hair:#3a3836;--ov:rgba(255,255,255,0.08);--link:#62aef0;--needInk:#f2a464;--glass:rgba(44,43,41,0.58);--glassEdge:rgba(255,255,255,0.12);--glassHi:rgba(255,255,255,0.12);color-scheme:dark}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid #0075de;outline-offset:2px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.eyebrow{font-size:12px;line-height:1.33;font-weight:600;letter-spacing:.125px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:inset 0 1px 0 var(--glassHi),rgba(0,0,0,0.04) 0px 4px 18px,rgba(0,0,0,0.027) 0px 2.025px 7.847px}
.btn-u{height:40px;padding:4px 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;background:var(--surface);border:1px solid var(--hair)}
.tile{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.need{width:18px;height:18px;border-radius:50%;background:#dd5b00;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tab{width:60px;height:64px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,174,57,0.5)}70%{box-shadow:0 0 0 6px rgba(26,174,57,0)}100%{box-shadow:0 0 0 0 rgba(26,174,57,0)}}
.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</helmet>
<div class="th {{themeClass}}" style="width:466px;height:678px;position:relative;overflow:hidden;border-radius:8px 59px 59px 8px;background:var(--canvas);font-family:Inter,-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;font-feature-settings:'lnum','locl';color:var(--ink);-webkit-font-smoothing:antialiased">

<div style="position:absolute;inset:0;overflow:hidden;padding:30px 88px 24px 20px;display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px">等你处理</h1>
<div style="display:flex;align-items:center;gap:8px;padding-bottom:4px;font-size:14px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg>
<span style="flex:1">July 的 MacBook Pro</span><span class="dot" style="width:8px;height:8px;background:#1aae39"></span><span>已连接</span>
</div>

<button style="width:100%;background:var(--surface);border:1.5px solid #dd5b00;border-radius:20px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px">
<span style="display:flex;align-items:center;gap:10px;width:100%">
<span class="need" aria-hidden="true">!</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">feat/oauth-pkce</span><span style="font-size:14px;color:var(--needInk)">等你批准 · Shell 命令</span></span>
<span class="tile" style="background:#dd5b00;color:#fff">C</span>
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color:var(--muted)"><path d="m9 6 6 6-6 6"></path></svg>
</span>
<span class="mono" style="width:100%;font-size:12.5px;line-height:1.5;background:var(--canvas);border-radius:8px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">go test ./internal/auth/... -v -race</span>
</button>
<button style="width:100%;background:var(--surface);border:1.5px solid #dd5b00;border-radius:20px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px">
<span class="need" aria-hidden="true">?</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">fix/rate-limit</span><span style="font-size:14px;color:var(--needInk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">等你作答 · 选哪种限流算法？</span></span>
<span class="tile" style="background:#2a9d99;color:#fff">X</span>
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color:var(--muted)"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<div style="width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:10px">
<span aria-hidden="true" style="width:18px;height:18px;border-radius:5px;background:#ff64c8;color:#391c57;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">×</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">fix/notify-dedupe</span><span style="font-size:14px;color:var(--muted)">出错 · 429 额度上限</span></span>
<button class="btn-u">重试</button>
</div>
<div class="eyebrow" style="padding:8px 2px 0;color:var(--muted)">运行中</div>
<div style="background:var(--surface);border:1px solid var(--hair);border-radius:20px;overflow:hidden">
<div style="min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--hair)"><span class="dot pulse" style="background:#1aae39"></span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">perf/orders-n-plus-1</span><span style="font-size:14px;color:var(--muted)">跑测试 · 1 分 20 秒</span></span><span class="tile" style="background:#2a9d99;color:#fff">X</span></div>
<div style="min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px"><span class="dot pulse" style="background:#1aae39"></span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">test/oauth-callback-errors</span><span style="font-size:14px;color:var(--muted)">执行 setup 脚本</span></span><span class="tile" style="background:#dd5b00;color:#fff">C</span></div>
</div>
</div>

<div aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;width:120px;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--canvas) 70%,transparent) 45%,var(--canvas))"></div>

<div aria-label="竖条：工具栏与标签栏（系统给出的 trailing 边，上方留给摄像头与状态）" style="position:absolute;top:168px;right:12px;bottom:22px;width:68px;display:flex;flex-direction:column;align-items:center;gap:12px">
<button aria-label="新任务" class="glass" style="width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<nav aria-label="标签栏" class="glass" style="width:68px;border-radius:9999px;padding:4px;display:flex;flex-direction:column;gap:2px">
<button aria-current="page" class="tab" style="background:var(--ov);color:var(--link)">
<svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5.5 5h13l2.5 8v6H3v-6z"></path></svg>
<span style="font-size:11px;font-weight:600;letter-spacing:.125px">等你处理</span>
<span style="position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9999px;background:#dd5b00;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">3</span>
</button>
<button class="tab" style="color:var(--ink2)"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="font-size:11px;font-weight:600;letter-spacing:.125px">会话</span></button>
<button class="tab" style="color:var(--ink2)"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg><span style="font-size:11px;font-weight:600;letter-spacing:.125px">设置</span></button>
</nav>
<span style="flex:1"></span>
<button aria-label="搜索" class="glass" style="width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["浅色","深色"],"default":"浅色","section":"外观"},"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.appearance ?? '浅色') === '深色' ? 'dk' : '' };
  }
}
</script>
</body>
</html>
