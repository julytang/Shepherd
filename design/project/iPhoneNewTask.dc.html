<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shepherd · iPhone 新建任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th{--canvas:#f6f5f4;--surface:#ffffff;--ink:rgba(0,0,0,0.95);--ink2:#31302e;--muted:#615d59;--faint:#a39e98;--hair:#e6e6e6;--input:#dddddd;--ov:rgba(0,0,0,0.05);--link:#0075de;--needInk:#793400;--glass:rgba(255,255,255,0.62);--glassEdge:rgba(255,255,255,0.72);--glassHi:rgba(255,255,255,0.9);--dim:rgba(0,0,0,0.18);color-scheme:light}
.th.dk{--canvas:#191817;--surface:#252422;--ink:rgba(255,255,255,0.92);--ink2:#dcd8d3;--muted:#a39e98;--faint:#7d7873;--hair:#3a3836;--input:#4a4744;--ov:rgba(255,255,255,0.08);--link:#62aef0;--needInk:#f2a464;--glass:rgba(44,43,41,0.62);--glassEdge:rgba(255,255,255,0.12);--glassHi:rgba(255,255,255,0.12);--dim:rgba(0,0,0,0.45);color-scheme:dark}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #0075de;outline-offset:2px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;line-height:1.33;font-weight:600;letter-spacing:.125px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:inset 0 1px 0 var(--glassHi),rgba(0,0,0,0.04) 0px 14px 28px,rgba(0,0,0,0.08) 0px 23px 52px}
.glass-tint{background:rgba(0,117,222,0.92);color:#fff;border:1px solid rgba(255,255,255,0.3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),rgba(0,0,0,0.04) 0px 4px 18px}
.icb{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow{min-height:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;border-bottom:1px solid var(--hair);font-size:16px}
.lrow:last-child{border-bottom:0}
.lrow .k{flex:1}
.lrow .v{color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tile{width:18px;height:18px;border-radius:5px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
</style>
</helmet>
<div class="th {{themeClass}}" style="width:402px;height:874px;position:relative;overflow:hidden;background:var(--canvas);font-family:Inter,-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;font-feature-settings:'lnum','locl';color:var(--ink);-webkit-font-smoothing:antialiased">

<div aria-hidden="true" style="position:absolute;inset:0;padding:62px 16px 0;display:flex;flex-direction:column;gap:12px">
<div style="font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px;padding:4px 4px 0">等你处理</div>
<div style="height:24px"></div>
<div style="height:118px;border-radius:20px;background:var(--surface);border:1.5px solid #dd5b00"></div>
<div style="height:72px;border-radius:20px;background:var(--surface);border:1.5px solid #dd5b00"></div>
<div style="height:72px;border-radius:20px;background:var(--surface);border:1px solid var(--hair)"></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:var(--dim)"></div>

<div role="dialog" aria-labelledby="nt-title" class="glass" style="position:absolute;left:8px;right:8px;top:118px;bottom:8px;border-radius:47px;padding:10px 16px 24px;display:flex;flex-direction:column;gap:14px">
<span aria-hidden="true" style="align-self:center;width:36px;height:5px;border-radius:3px;background:var(--faint);opacity:.6"></span>
<div style="display:flex;align-items:center;gap:8px">
<button aria-label="取消" class="icb" style="background:var(--ov)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<h2 id="nt-title" style="margin:0;flex:1;text-align:center;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-0.125px">新任务</h2>
<button aria-label="创建并开始" class="icb glass-tint"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="stroke-width:2.4"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></button>
</div>

<label for="nt-prompt" class="sr">任务描述</label>
<textarea id="nt-prompt" rows="4" style="resize:none;border:1px solid #0075de;border-radius:4px;padding:12px 14px;font-size:16px;line-height:1.5;background:var(--surface)" placeholder="描述要交给 Agent 的任务…">给 OAuth callback 补齐异常路径单测：state 不匹配、verifier 缺失、code 过期。</textarea>

<div style="display:flex;flex-direction:column;gap:6px">
<span class="eyebrow" style="padding:0 4px;color:var(--muted)">Agent（provider）</span>
<div style="display:flex;padding:3px;border-radius:9999px;background:var(--ov)">
<span style="flex:1;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;background:var(--surface);box-shadow:rgba(0,0,0,0.08) 0px 1px 3px"><span class="tile" style="background:#dd5b00;color:#fff">C</span>Claude</span>
<span style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500"><span class="tile" style="background:#2a9d99;color:#fff">X</span>Codex</span>
<span style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500"><span class="tile" style="background:#d6b6f6;color:#391c57">A</span>Gemini</span>
</div>
</div>

<div style="background:var(--surface);border:1px solid var(--hair);border-radius:20px;overflow:hidden">
<div class="lrow"><span class="k">仓库</span><span class="v">api-server<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span></div>
<div class="lrow"><span class="k">基于分支</span><span class="v mono" style="font-size:14px">main<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span></div>
<div class="lrow"><span class="k">模型</span><span class="v">Sonnet<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span></div>
<div class="lrow"><span class="k">权限档位</span><span class="v">沿用我的 Claude 设置<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span></div>
<div class="lrow" style="flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px"><span style="font-size:14px;color:var(--muted)">分支名 · 自动生成，可修改</span><span class="mono" style="font-size:14px">test/oauth-callback-errors</span></div>
</div>

<div style="display:flex;align-items:flex-start;gap:10px;padding:0 4px;font-size:14px;line-height:1.43;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="margin-top:2px"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg>
<span>Worktree 在 July 的 MacBook Pro 上创建。setup 脚本已信任；第一次加入的仓库需要先在 Mac 上确认信任。「完全放行」档位只能在 Mac 上开启。</span>
</div>
<span style="flex:1"></span>
<button class="glass-tint" style="height:52px;border-radius:9999px;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px">在 Mac 上创建并开始</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["浅色","深色"],"default":"深色","section":"外观"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.appearance ?? '深色') === '深色' ? 'dk' : '' };
  }
}
</script>
</body>
</html>
