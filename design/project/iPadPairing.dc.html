<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shepherd · iPad 未绑定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th{--canvas:#f6f5f4;--surface:#ffffff;--ink:rgba(0,0,0,0.95);--ink2:#31302e;--muted:#615d59;--faint:#a39e98;--hair:#e6e6e6;--ov:rgba(0,0,0,0.05);--link:#0075de;color-scheme:light}
.th.dk{--canvas:#191817;--surface:#252422;--ink:rgba(255,255,255,0.92);--ink2:#dcd8d3;--muted:#a39e98;--faint:#7d7873;--hair:#3a3836;--ov:rgba(255,255,255,0.08);--link:#62aef0;color-scheme:dark}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid #0075de;outline-offset:2px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glass-tint{background:rgba(0,117,222,0.92);color:#fff;border:1px solid rgba(255,255,255,0.3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),rgba(0,0,0,0.04) 0px 4px 18px}
.glass-tint:active{background:#005bab}
.num{width:28px;height:28px;border-radius:50%;background:var(--ov);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.step{display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.5;color:var(--ink)}
</style>
</helmet>
<div class="th {{themeClass}}" style="width:1210px;height:834px;position:relative;overflow:hidden;background:var(--canvas);font-family:Inter,-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;font-feature-settings:'lnum','locl';color:var(--ink);-webkit-font-smoothing:antialiased">

<div style="position:absolute;inset:24px 0 20px;display:flex;align-items:center;justify-content:center;gap:72px;padding:0 80px">

<div aria-hidden="true" style="position:relative;width:480px;height:440px;flex-shrink:0">
<div style="position:absolute;left:0;top:40px;width:200px;height:200px;border-radius:50%;background:#62aef0;opacity:.9"></div>
<svg viewBox="0 0 100 100" width="96" height="96" style="position:absolute;right:20px;top:0"><path d="M50 4 62 37 97 38 69 59 79 93 50 73 21 93 31 59 3 38 38 37z" fill="#dd5b00"></path></svg>
<div style="position:absolute;left:30px;bottom:24px;width:110px;height:110px;border-radius:26px;background:#d6b6f6;transform:rotate(-10deg)"></div>
<div style="position:absolute;right:40px;bottom:60px;width:64px;height:64px;border-radius:50%;background:#2a9d99"></div>
<div style="position:absolute;left:60px;top:96px;width:330px;height:214px;border-radius:16px;background:var(--surface);border:2.5px solid var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
<svg viewBox="-2 -2 29 29" width="120" height="120" style="shape-rendering:crispEdges"><rect x="-2" y="-2" width="29" height="29" fill="#ffffff"></rect><path d="{{qrPath}}" fill="#000000"></path></svg>
<span class="mono" style="font-size:13px;color:var(--muted)">4:52 后过期</span>
</div>
<div style="position:absolute;left:28px;top:310px;width:394px;height:14px;border-radius:0 0 12px 12px;background:var(--ink2)"></div>
<div style="position:absolute;left:330px;top:170px;width:140px;height:196px;border-radius:20px;background:var(--surface);border:2.5px solid var(--ink2);display:flex;align-items:center;justify-content:center;transform:rotate(6deg)">
<svg class="ic" viewBox="0 0 24 24" width="40" height="40" style="color:#0075de"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M4 12h16"></path></svg>
</div>
</div>

<div style="width:480px;display:flex;flex-direction:column">
<h1 style="margin:0 0 12px;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px">连接你的 Mac</h1>
<p style="margin:0 0 28px;font-size:17px;line-height:1.5;color:var(--ink2)">Agent 只在 Mac 上运行。连上之后，可以在 iPad 上看进度、审批与作答、审查 Diff、提交并创建 PR。</p>
<ol style="margin:0 0 36px;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px">
<li class="step"><span class="num">1</span><span>在 Mac 上打开 Shepherd，进入「设置 › 设备」，点「绑定新设备…」</span></li>
<li class="step"><span class="num">2</span><span>用 iPad 扫描 Mac 上的二维码</span></li>
<li class="step"><span class="num">3</span><span>核对两边的 6 位验证码，在 Mac 上确认</span></li>
</ol>
<button class="glass-tint" style="align-self:flex-start;height:52px;min-width:280px;padding:0 32px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:500">扫描二维码</button>
<p style="margin:14px 0 0;font-size:14px;line-height:1.43;color:var(--muted)">经中继连接，内容端到端加密。不需要账号。</p>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["浅色","深色"],"default":"浅色","section":"外观"},"$preview":{"width":1210,"height":834}}'>
class Component extends DCLogic {
  qrPath() {
    const N = 25;
    let s = 8 * 9973 + 17;
    const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    const m = [];
    for (let y = 0; y < N; y++) { m.push([]); for (let x = 0; x < N; x++) m[y].push(rnd() < 0.46); }
    const finder = (ox, oy) => {
      for (let dy = -1; dy <= 7; dy++) for (let dx = -1; dx <= 7; dx++) {
        const x = ox + dx, y = oy + dy;
        if (x < 0 || y < 0 || x >= N || y >= N) continue;
        const inside = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6;
        m[y][x] = inside && (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
      }
    };
    finder(0, 0); finder(18, 0); finder(0, 18);
    for (let i = 8; i <= 16; i++) { m[6][i] = i % 2 === 0; m[i][6] = i % 2 === 0; }
    let d = '';
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (m[y][x]) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    return d;
  }

  renderVals() {
    return {
      themeClass: (this.props.appearance ?? '浅色') === '深色' ? 'dk' : '',
      qrPath: this.qrPath()
    };
  }
}
</script>
</body>
</html>
